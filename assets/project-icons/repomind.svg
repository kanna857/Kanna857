<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="repoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0C24"/>
      <stop offset="100%" stop-color="#241442"/>
    </linearGradient>
    <linearGradient id="repoViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="repoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEAA8"/>
      <stop offset="100%" stop-color="#F5C76B"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#repoBg)" stroke="url(#repoGold)" stroke-width="2"/>
  <!-- Codebase Investigation & AI Knowledge Graph -->
  <g transform="translate(60, 60)">
    <!-- Branching Tree / Git Graph Neural Structure -->
    <!-- Git Branch Line Main -->
    <path d="M -16 28 L -16 -12 Q -16 -24 0 -24 L 14 -24" fill="none" stroke="url(#repoViolet)" stroke-width="2.5"/>
    <!-- Git Feature Branch -->
    <path d="M -16 8 Q 12 8 12 -4 L 12 -24" fill="none" stroke="url(#repoGold)" stroke-width="2.5"/>
    <!-- Commit / Neural Nodes -->
    <circle cx="-16" cy="24" r="5" fill="url(#repoGold)"/>
    <circle cx="-16" cy="-4" r="4.5" fill="#00D9C6"/>
    <circle cx="12" cy="0" r="4.5" fill="url(#repoGold)"/>
    <circle cx="14" cy="-24" r="6" fill="#C084FC"/>
    <circle cx="14" cy="-24" r="3" fill="#FFFBE8"/>
    <!-- AI Search Lens / Radar Over Codebase -->
    <circle cx="14" cy="14" r="12" fill="none" stroke="#00D9C6" stroke-width="2"/>
    <line x1="23" y1="23" x2="32" y2="32" stroke="#00D9C6" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
