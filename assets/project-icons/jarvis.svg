<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="jarvisBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B1E"/>
      <stop offset="100%" stop-color="#0F2B48"/>
    </linearGradient>
    <linearGradient id="arcCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00D9C6"/>
    </linearGradient>
    <linearGradient id="coreGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F5C76B"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#jarvisBg)" stroke="url(#arcCyan)" stroke-width="2"/>
  <!-- Multi-Agent Assistant / Arc Core & Vision Matrix -->
  <g transform="translate(60, 60)">
    <!-- Rotating Ring Segment Design -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#00D9C6" stroke-width="1.5" stroke-dasharray="14 8"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="24 10"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#coreGold)" stroke-width="1.5"/>
    <!-- Core Reactor / Neural AI Eye -->
    <circle cx="0" cy="0" r="10" fill="url(#arcCyan)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFBE8"/>
    <!-- Peripheral Vision / Multi-Agent Sensors -->
    <line x1="0" y1="-34" x2="0" y2="-42" stroke="url(#coreGold)" stroke-width="2"/>
    <line x1="0" y1="34" x2="0" y2="42" stroke="url(#coreGold)" stroke-width="2"/>
    <line x1="-34" y1="0" x2="-42" y2="0" stroke="url(#coreGold)" stroke-width="2"/>
    <line x1="34" y1="0" x2="42" y2="0" stroke="url(#coreGold)" stroke-width="2"/>
  </g>
</svg>
