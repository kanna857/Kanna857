<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="50%" stop-color="#101738"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="20%" stop-color="#F5C76B"/>
      <stop offset="80%" stop-color="#F5C76B"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes lotusPulse { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes dashFlow { to { stroke-dashoffset: -40; } }
    @keyframes circuitDash { to { stroke-dashoffset: -20; } }
    @keyframes fadeGlow { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>
  <!-- Background -->
  <rect width="1200" height="60" rx="12" fill="url(#bg)"/>
  <!-- Lotus Icon Left -->
  <g transform="translate(40, 30)" style="animation: lotusPulse 3s ease-in-out infinite; transform-origin: 40px 30px;">
    <!-- center petal -->
    <ellipse cx="0" cy="-3" rx="4" ry="8" fill="#F5A3C7" opacity="0.9"/>
    <!-- left petals -->
    <ellipse cx="-5" cy="-1" rx="3.5" ry="7" fill="#F5A3C7" opacity="0.7" transform="rotate(-25)"/>
    <ellipse cx="-9" cy="1" rx="3" ry="6" fill="#F5A3C7" opacity="0.5" transform="rotate(-50)"/>
    <!-- right petals -->
    <ellipse cx="5" cy="-1" rx="3.5" ry="7" fill="#F5A3C7" opacity="0.7" transform="rotate(25)"/>
    <ellipse cx="9" cy="1" rx="3" ry="6" fill="#F5A3C7" opacity="0.5" transform="rotate(50)"/>
    <!-- center dot -->
    <circle cx="0" cy="-1" r="2" fill="#F5C76B" style="animation: fadeGlow 2s ease-in-out infinite;"/>
  </g>
  <!-- Center Text -->
  <text x="600" y="36" text-anchor="middle" fill="#F5C76B" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" filter="url(#glow)">🪷 About Me — The Journey of a Curious Mind</text>
  <!-- AI Circuit Right -->
  <g transform="translate(1120, 18)" stroke="#00D9C6" fill="none" stroke-width="1.2" opacity="0.7">
    <line x1="0" y1="12" x2="25" y2="12" stroke-dasharray="4,3" style="animation: circuitDash 1.5s linear infinite;"/>
    <line x1="10" y1="4" x2="10" y2="20" stroke-dasharray="3,3" style="animation: circuitDash 2s linear infinite;"/>
    <line x1="18" y1="6" x2="30" y2="6" stroke-dasharray="4,2" style="animation: circuitDash 1.8s linear infinite;"/>
    <line x1="18" y1="18" x2="30" y2="18" stroke-dasharray="4,2" style="animation: circuitDash 2.2s linear infinite;"/>
    <circle cx="10" cy="12" r="2" fill="#00D9C6" style="animation: fadeGlow 2s ease-in-out infinite;"/>
    <circle cx="25" cy="6" r="1.5" fill="#00D9C6" opacity="0.6"/>
    <circle cx="25" cy="18" r="1.5" fill="#00D9C6" opacity="0.6"/>
  </g>
  <!-- Bottom golden line -->
  <line x1="60" y1="56" x2="1140" y2="56" stroke="url(#goldLine)" stroke-width="1" stroke-dasharray="8,4" style="animation: dashFlow 2s linear infinite;" opacity="0.7"/>
</svg>