<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="50%" stop-color="#101738"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="20%" stop-color="#F5C76B"/>
      <stop offset="80%" stop-color="#F5C76B"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes twinkle { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; } }
    @keyframes twinkle2 { 0%,100% { transform: scale(1.2); opacity: 1; } 50% { transform: scale(0.8); opacity: 0.5; } }
    @keyframes dashFlow { to { stroke-dashoffset: -40; } }
    @keyframes lotusPulse { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes fadeGlow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  </style>
  <!-- Background -->
  <rect width="1200" height="60" rx="12" fill="url(#bg)"/>
  <!-- Star/Sparkle Icon Left -->
  <g transform="translate(40, 30)" filter="url(#starGlow)">
    <!-- 4-point star -->
    <polygon points="0,-10 2,-3 0,-1 -2,-3" fill="#F5C76B" style="animation: twinkle 2s ease-in-out infinite; transform-origin: 40px 30px;"/>
    <polygon points="0,1 2,3 0,10 -2,3" fill="#F5C76B" style="animation: twinkle 2s ease-in-out infinite; transform-origin: 40px 30px;"/>
    <polygon points="-10,0 -3,-2 -1,0 -3,2" fill="#F5C76B" style="animation: twinkle 2s ease-in-out infinite; transform-origin: 40px 30px;"/>
    <polygon points="1,0 3,-2 10,0 3,2" fill="#F5C76B" style="animation: twinkle 2s ease-in-out infinite; transform-origin: 40px 30px;"/>
    <circle cx="0" cy="0" r="2" fill="#F5C76B" style="animation: fadeGlow 2s ease-in-out infinite;"/>
    <!-- small accent sparkles -->
    <circle cx="6" cy="-7" r="1" fill="#F5C76B" style="animation: twinkle2 2.5s ease-in-out infinite; transform-origin: 46px 23px;" opacity="0.6"/>
    <circle cx="-7" cy="5" r="0.8" fill="#F5C76B" style="animation: twinkle2 3s ease-in-out infinite; transform-origin: 33px 35px;" opacity="0.4"/>
  </g>
  <!-- Center Text -->
  <text x="600" y="36" text-anchor="middle" fill="#F5C76B" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" filter="url(#glow)">✨ Divine Creations — Engineering Intelligence</text>
  <!-- Lotus Icon Right -->
  <g transform="translate(1145, 30)" style="animation: lotusPulse 3s ease-in-out infinite; transform-origin: 1145px 30px;">
    <ellipse cx="0" cy="-3" rx="4" ry="8" fill="#F5A3C7" opacity="0.9"/>
    <ellipse cx="-5" cy="-1" rx="3.5" ry="7" fill="#F5A3C7" opacity="0.7" transform="rotate(-25)"/>
    <ellipse cx="-9" cy="1" rx="3" ry="6" fill="#F5A3C7" opacity="0.5" transform="rotate(-50)"/>
    <ellipse cx="5" cy="-1" rx="3.5" ry="7" fill="#F5A3C7" opacity="0.7" transform="rotate(25)"/>
    <ellipse cx="9" cy="1" rx="3" ry="6" fill="#F5A3C7" opacity="0.5" transform="rotate(50)"/>
    <circle cx="0" cy="-1" r="2" fill="#F5C76B" style="animation: fadeGlow 2s ease-in-out infinite;"/>
  </g>
  <!-- Bottom golden line -->
  <line x1="60" y1="56" x2="1140" y2="56" stroke="url(#goldLine)" stroke-width="1" stroke-dasharray="8,4" style="animation: dashFlow 2s linear infinite;" opacity="0.7"/>
</svg>