<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="900" height="70">
  <defs>
    <linearGradient id="typeGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F5C76B"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <filter id="typeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .cursor {
      animation: blink 0.9s infinite;
    }
    .text-line {
      font-family: 'Fira Code', 'Courier New', monospace, Consolas;
      font-size: 24px;
      font-weight: 600;
      fill: url(#typeGold);
      filter: url(#typeGlow);
    }
    
    /* 6 rotating messages (18s total cycle, 3s each) */
    .msg1 { animation: cycle1 18s infinite; }
    .msg2 { animation: cycle2 18s infinite; }
    .msg3 { animation: cycle3 18s infinite; }
    .msg4 { animation: cycle4 18s infinite; }
    .msg5 { animation: cycle5 18s infinite; }
    .msg6 { animation: cycle6 18s infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes cycle1 {
      0%, 14% { opacity: 1; }
      16.66%, 100% { opacity: 0; }
    }
    @keyframes cycle2 {
      0%, 16.66% { opacity: 0; }
      18%, 31% { opacity: 1; }
      33.33%, 100% { opacity: 0; }
    }
    @keyframes cycle3 {
      0%, 33.33% { opacity: 0; }
      35%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes cycle4 {
      0%, 50% { opacity: 0; }
      52%, 64% { opacity: 1; }
      66.66%, 100% { opacity: 0; }
    }
    @keyframes cycle5 {
      0%, 66.66% { opacity: 0; }
      68%, 81% { opacity: 1; }
      83.33%, 100% { opacity: 0; }
    }
    @keyframes cycle6 {
      0%, 83.33% { opacity: 0; }
      85%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <!-- Dark Rounded Container for Universal Contrast (Dark & Light theme support) -->
  <rect x="5" y="5" width="890" height="60" rx="14" fill="#070D24" stroke="#F5C76B" stroke-width="1.2" opacity="0.95"/>

  <!-- Rotating Messages Centered -->
  <g text-anchor="middle" transform="translate(450, 42)">
    <text class="text-line msg1">Namaste! I'm Padma Dhanush <tspan class="cursor" fill="#00D9C6">|</tspan></text>
    <text class="text-line msg2">AI &amp; Machine Learning Developer <tspan class="cursor" fill="#00D9C6">|</tspan></text>
    <text class="text-line msg3">Building Intelligent AI Agents <tspan class="cursor" fill="#00D9C6">|</tspan></text>
    <text class="text-line msg4">Exploring Deep Learning &amp; Computer Vision <tspan class="cursor" fill="#00D9C6">|</tspan></text>
    <text class="text-line msg5">Passionate About Research &amp; Innovation <tspan class="cursor" fill="#00D9C6">|</tspan></text>
    <text class="text-line msg6">Code with Purpose. Create with Devotion. <tspan class="cursor" fill="#00D9C6">|</tspan></text>
  </g>
</svg>
