<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="50%" stop-color="#101738"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="20%" stop-color="#F5C76B"/>
      <stop offset="80%" stop-color="#F5C76B"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes dashFlow { to { stroke-dashoffset: -40; } }
    @keyframes fadeGlow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scopePulse { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes orbit { from { transform: rotate(0deg) translateX(10px) rotate(0deg); } to { transform: rotate(360deg) translateX(10px) rotate(-360deg); } }
    @keyframes signalPulse { 0%,100% { opacity: 0.2; } 50% { opacity: 0.7; } }
  </style>
  <!-- Background -->
  <rect width="1200" height="60" rx="12" fill="url(#bg)"/>
  <!-- Research/Microscope Icon Left -->
  <g transform="translate(40, 30)" style="animation: scopePulse 3s ease-in-out infinite; transform-origin: 40px 30px;">
    <!-- lens -->
    <circle cx="0" cy="-5" r="6" fill="none" stroke="#00D9C6" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="-5" r="3" fill="#00D9C6" opacity="0.15"/>
    <!-- handle -->
    <line x1="4" y1="0" x2="9" y2="7" stroke="#00D9C6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- shine on lens -->
    <path d="M-3,-8 Q-1,-10 1,-8" fill="none" stroke="#00D9C6" stroke-width="0.8" opacity="0.5"/>
    <!-- glow dot in center -->
    <circle cx="0" cy="-5" r="1.5" fill="#00D9C6" style="animation: fadeGlow 2s ease-in-out infinite;"/>
  </g>
  <!-- Center Text -->
  <text x="600" y="36" text-anchor="middle" fill="#F5C76B" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" filter="url(#glow)">🔬 Research &amp; Exploration</text>
  <!-- Satellite Icon Right -->
  <g transform="translate(1140, 30)">
    <!-- satellite body -->
    <rect x="-4" y="-3" width="8" height="6" rx="1" fill="#00D9C6" opacity="0.7"/>
    <!-- solar panels -->
    <rect x="-12" y="-2" width="7" height="4" rx="0.5" fill="#173A78" stroke="#00D9C6" stroke-width="0.6" opacity="0.6"/>
    <rect x="5" y="-2" width="7" height="4" rx="0.5" fill="#173A78" stroke="#00D9C6" stroke-width="0.6" opacity="0.6"/>
    <!-- antenna -->
    <line x1="0" y1="-3" x2="0" y2="-7" stroke="#00D9C6" stroke-width="0.6" opacity="0.5"/>
    <circle cx="0" cy="-8" r="1" fill="#F5C76B" style="animation: fadeGlow 1.5s ease-in-out infinite;"/>
    <!-- signal arcs -->
    <path d="M3,-9 Q6,-12 3,-15" fill="none" stroke="#00D9C6" stroke-width="0.5" opacity="0.4" style="animation: signalPulse 2s ease-in-out infinite;"/>
    <path d="M5,-8 Q9,-12 5,-16" fill="none" stroke="#00D9C6" stroke-width="0.4" opacity="0.3" style="animation: signalPulse 2s 0.5s ease-in-out infinite;"/>
    <!-- orbiting dot -->
    <circle cx="0" cy="0" r="1" fill="#F5C76B" opacity="0.7" style="animation: orbit 4s linear infinite; transform-origin: 1140px 30px;"/>
  </g>
  <!-- Bottom golden line -->
  <line x1="60" y1="56" x2="1140" y2="56" stroke="url(#goldLine)" stroke-width="1" stroke-dasharray="8,4" style="animation: dashFlow 2s linear infinite;" opacity="0.7"/>
</svg>