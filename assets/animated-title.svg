<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="titleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="25%" stop-color="#101738"/>
      <stop offset="75%" stop-color="#101738"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>

    <!-- Sacred Gold Gradient -->
    <linearGradient id="titleGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5A838"/>
      <stop offset="30%" stop-color="#FFF0BA"/>
      <stop offset="50%" stop-color="#F5C76B"/>
      <stop offset="70%" stop-color="#FFF0BA"/>
      <stop offset="100%" stop-color="#E5A838"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .feather-left {
      animation: swayL 4.5s ease-in-out infinite alternate;
      transform-origin: 150px 70px;
    }
    .feather-right {
      animation: swayR 4.5s ease-in-out infinite alternate;
      transform-origin: 1050px 70px;
    }
    .circuit-line {
      stroke-dasharray: 15 10;
      animation: circuitFlow 4s linear infinite;
    }
    .twinkle {
      animation: starTwinkle 2.5s ease-in-out infinite alternate;
    }
    .tw-d1 { animation-delay: 0.7s; }
    .tw-d2 { animation-delay: 1.4s; }
    .tw-d3 { animation-delay: 2.1s; }

    .gold-particle {
      animation: particleRise 6s ease-in-out infinite;
    }
    .gp1 { animation-delay: 1.5s; }
    .gp2 { animation-delay: 3.5s; }

    @keyframes swayL {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }
    @keyframes swayR {
      0% { transform: rotate(8deg); }
      100% { transform: rotate(-8deg); }
    }
    @keyframes circuitFlow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -50; }
    }
    @keyframes starTwinkle {
      0% { opacity: 0.15; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes particleRise {
      0% { transform: translateY(10px); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-20px); opacity: 0; }
    }
  </style>

  <!-- Background Base Container -->
  <rect x="10" y="8" width="1180" height="124" rx="20" fill="url(#titleBg)"/>

  <!-- AI Circuit Futuristic Header Accent Lines (Top and Bottom) -->
  <path class="circuit-line" d="M 180 18 L 1020 18" stroke="#00D9C6" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path class="circuit-line" d="M 220 122 L 980 122" stroke="#00D9C6" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Outer Sacred Golden Border -->
  <rect x="10" y="8" width="1180" height="124" rx="20" fill="none" stroke="url(#titleGold)" stroke-width="1.5" opacity="0.8"/>

  <!-- ================= LEFT PEACOCK FEATHER ================= -->
  <g class="feather-left" transform="translate(130, 70)" filter="url(#goldGlow)">
    <!-- Golden Quill Stem -->
    <path d="M -50 45 Q 0 0 50 -35" stroke="url(#titleGold)" stroke-width="3" fill="none"/>
    <!-- Outer Emerald Plumage -->
    <ellipse cx="25" cy="-20" rx="24" ry="38" fill="#0B5D4E" transform="rotate(35 25 -20)"/>
    <!-- Peacock Teal Layer -->
    <ellipse cx="25" cy="-20" rx="16" ry="26" fill="#00D9C6" transform="rotate(35 25 -20)"/>
    <!-- Krishna Royal Blue Core -->
    <ellipse cx="25" cy="-20" rx="10" ry="17" fill="#173A78" transform="rotate(35 25 -20)"/>
    <!-- Golden Anther Spark -->
    <circle cx="25" cy="-20" r="5" fill="#F5C76B"/>
  </g>

  <!-- ================= RIGHT PEACOCK FEATHER ================= -->
  <g class="feather-right" transform="translate(1070, 70)" filter="url(#goldGlow)">
    <!-- Golden Quill Stem -->
    <path d="M 50 45 Q 0 0 -50 -35" stroke="url(#titleGold)" stroke-width="3" fill="none"/>
    <!-- Outer Emerald Plumage -->
    <ellipse cx="-25" cy="-20" rx="24" ry="38" fill="#0B5D4E" transform="rotate(-35 -25 -20)"/>
    <!-- Peacock Teal Layer -->
    <ellipse cx="-25" cy="-20" rx="16" ry="26" fill="#00D9C6" transform="rotate(-35 -25 -20)"/>
    <!-- Krishna Royal Blue Core -->
    <ellipse cx="-25" cy="-20" rx="10" ry="17" fill="#173A78" transform="rotate(-35 -25 -20)"/>
    <!-- Golden Anther Spark -->
    <circle cx="-25" cy="-20" r="5" fill="#F5C76B"/>
  </g>

  <!-- ================= CENTER TYPOGRAPHY ================= -->
  <!-- Top Sanskrit Invocation -->
  <text x="600" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="url(#titleGold)" filter="url(#goldGlow)" letter-spacing="4">
    ॥ राधे राधे ॥
  </text>

  <!-- Main Persona Name -->
  <text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="900" fill="url(#titleGold)" filter="url(#goldGlow)" letter-spacing="3">
    PADMA DHANUSH
  </text>

  <!-- Subtitle (The Digital Vrindavan) -->
  <text x="600" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#00D9C6" filter="url(#tealGlow)" letter-spacing="2">
    DIVINE AI — THE DIGITAL VRINDAVAN • AI/ML ENGINEER
  </text>

  <!-- Twinkling Stars -->
  <g fill="#FFF5C2">
    <circle class="twinkle" cx="340" cy="40" r="2"/>
    <circle class="twinkle tw-d1" cx="420" cy="98" r="2.5"/>
    <circle class="twinkle tw-d2" cx="780" cy="40" r="2.5"/>
    <circle class="twinkle tw-d3" cx="860" cy="95" r="2"/>
    <circle class="twinkle tw-d1" cx="260" cy="70" r="1.8"/>
    <circle class="twinkle tw-d2" cx="940" cy="65" r="1.8"/>
  </g>

  <!-- Floating Golden Particles -->
  <g fill="#F5C76B" opacity="0.8">
    <circle class="gold-particle" cx="500" cy="70" r="2"/>
    <circle class="gold-particle gp1" cx="700" cy="65" r="2.2"/>
    <circle class="gold-particle gp2" cx="600" cy="20" r="1.6"/>
  </g>
</svg>
