<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="50%" stop-color="#101738"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="20%" stop-color="#F5C76B"/>
      <stop offset="80%" stop-color="#F5C76B"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes glowPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes dashFlow { to { stroke-dashoffset: -40; } }
    @keyframes twinkle1 { 0%,100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes twinkle2 { 0%,100% { opacity: 1; transform: scale(1.1); } 50% { opacity: 0.3; transform: scale(0.7); } }
    @keyframes twinkle3 { 0%,100% { opacity: 0.5; transform: scale(1); } 33% { opacity: 1; transform: scale(1.3); } 66% { opacity: 0.2; transform: scale(0.6); } }
  </style>
  <!-- Background -->
  <rect width="1200" height="60" rx="12" fill="url(#bg)"/>
  <!-- Moon Crescent Left -->
  <g transform="translate(40, 30)" filter="url(#moonGlow)">
    <circle cx="0" cy="0" r="9" fill="#F5C76B" opacity="0.85" style="animation: glowPulse 3s ease-in-out infinite;"/>
    <circle cx="4" cy="-3" r="7.5" fill="#05091C"/>
    <!-- tiny star near moon -->
    <circle cx="10" cy="-8" r="1" fill="#F5C76B" style="animation: twinkle1 2s ease-in-out infinite; transform-origin: 50px 22px;"/>
  </g>
  <!-- Center Text -->
  <text x="600" y="36" text-anchor="middle" fill="#F5C76B" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" filter="url(#glow)">🌙 GitHub Constellation — My Coding Universe</text>
  <!-- Star Cluster Right -->
  <g transform="translate(1130, 30)">
    <circle cx="0" cy="-5" r="2" fill="#F5C76B" filter="url(#glow)" style="animation: twinkle1 2.2s ease-in-out infinite; transform-origin: 1130px 25px;"/>
    <circle cx="8" cy="2" r="1.5" fill="#F5C76B" filter="url(#glow)" style="animation: twinkle2 2.8s ease-in-out infinite; transform-origin: 1138px 32px;"/>
    <circle cx="-4" cy="6" r="1.8" fill="#F5C76B" filter="url(#glow)" style="animation: twinkle3 2s ease-in-out infinite; transform-origin: 1126px 36px;"/>
    <circle cx="12" cy="-8" r="1" fill="#F5C76B" opacity="0.5" style="animation: twinkle2 3s ease-in-out infinite; transform-origin: 1142px 22px;"/>
    <circle cx="-8" cy="-2" r="1.2" fill="#F5C76B" opacity="0.6" style="animation: twinkle1 2.5s ease-in-out infinite; transform-origin: 1122px 28px;"/>
    <circle cx="5" cy="8" r="0.8" fill="#A78BFA" opacity="0.4" style="animation: twinkle3 3.2s ease-in-out infinite; transform-origin: 1135px 38px;"/>
    <circle cx="-6" cy="-9" r="0.7" fill="#00D9C6" opacity="0.3" style="animation: twinkle2 2.6s ease-in-out infinite; transform-origin: 1124px 21px;"/>
  </g>
  <!-- Bottom golden line -->
  <line x1="60" y1="56" x2="1140" y2="56" stroke="url(#goldLine)" stroke-width="1" stroke-dasharray="8,4" style="animation: dashFlow 2s linear infinite;" opacity="0.7"/>
</svg>