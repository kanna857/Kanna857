<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="100%" stop-color="#101738"/>
    </linearGradient>
    <!-- Krishna body gradient -->
    <linearGradient id="krishnaBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7ab5"/>
      <stop offset="100%" stop-color="#173A78"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C76B"/>
      <stop offset="50%" stop-color="#FFE4A0"/>
      <stop offset="100%" stop-color="#F5C76B"/>
    </linearGradient>
    <!-- Moonlight gradient -->
    <linearGradient id="moonGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#E8E8FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05091C" stop-opacity="0"/>
    </linearGradient>
    <!-- Divine aura glow -->
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#F5C76B" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#F5C76B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F5C76B" stop-opacity="0"/>
    </radialGradient>
    <!-- Peacock feather eye gradient -->
    <radialGradient id="featherEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9C6"/>
      <stop offset="60%" stop-color="#006B63"/>
      <stop offset="100%" stop-color="#173A78"/>
    </radialGradient>
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes noteFloat1 {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.9; }
      80%  { opacity: 0.5; }
      100% { transform: translate(-30px, -120px); opacity: 0; }
    }
    @keyframes noteFloat2 {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.8; }
      80%  { opacity: 0.4; }
      100% { transform: translate(20px, -140px); opacity: 0; }
    }
    @keyframes noteFloat3 {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.85; }
      80%  { opacity: 0.3; }
      100% { transform: translate(-10px, -110px); opacity: 0; }
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes featherGlow {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    @keyframes twinkle1 {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }
    @keyframes twinkle2 {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.9; }
    }
    @keyframes twinkle3 {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 0.15; }
    }
    @keyframes particleRise1 {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: 0.8; }
      85%  { opacity: 0.3; }
      100% { transform: translateY(-80px); opacity: 0; }
    }
    @keyframes particleRise2 {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      15%  { opacity: 0.7; }
      85%  { opacity: 0.2; }
      100% { transform: translateY(-90px) translateX(10px); opacity: 0; }
    }
    @keyframes lotusSway {
      0%, 100% { transform: rotate(-3deg); }
      50%      { transform: rotate(3deg); }
    }
    .note1 { animation: noteFloat1 8s ease-in-out infinite; }
    .note2 { animation: noteFloat2 8s ease-in-out 2.5s infinite; }
    .note3 { animation: noteFloat3 8s ease-in-out 5s infinite; }
    .aura  { animation: auraPulse 4s ease-in-out infinite; transform-origin: 200px 180px; }
    .feather-eye { animation: featherGlow 3s ease-in-out infinite; }
    .star1 { animation: twinkle1 3s ease-in-out infinite; }
    .star2 { animation: twinkle2 4s ease-in-out 1s infinite; }
    .star3 { animation: twinkle3 2.5s ease-in-out 0.5s infinite; }
    .star4 { animation: twinkle1 3.5s ease-in-out 2s infinite; }
    .star5 { animation: twinkle2 2.8s ease-in-out 1.5s infinite; }
    .star6 { animation: twinkle3 3.2s ease-in-out 0.8s infinite; }
    .star7 { animation: twinkle1 4.2s ease-in-out 2.5s infinite; }
    .star8 { animation: twinkle2 3s ease-in-out 1.2s infinite; }
    .particle1 { animation: particleRise1 6s ease-out infinite; }
    .particle2 { animation: particleRise2 6s ease-out 1.5s infinite; }
    .particle3 { animation: particleRise1 6s ease-out 3s infinite; }
    .particle4 { animation: particleRise2 6s ease-out 4.5s infinite; }
    .lotus-base { animation: lotusSway 5s ease-in-out infinite; transform-origin: center bottom; }
  </style>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Moonlight beam -->
  <polygon points="340,0 200,200 280,0" fill="url(#moonGrad)" opacity="0.6"/>
  <polygon points="370,0 220,220 320,0" fill="url(#moonGrad)" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="45" cy="30" r="1.2" fill="#E8E8FF" class="star1"/>
  <circle cx="120" cy="55" r="1" fill="#E8E8FF" class="star2"/>
  <circle cx="310" cy="40" r="1.3" fill="#E8E8FF" class="star3"/>
  <circle cx="350" cy="80" r="0.9" fill="#E8E8FF" class="star4"/>
  <circle cx="70" cy="95" r="1.1" fill="#E8E8FF" class="star5"/>
  <circle cx="250" cy="25" r="1" fill="#E8E8FF" class="star6"/>
  <circle cx="380" cy="130" r="0.8" fill="#E8E8FF" class="star7"/>
  <circle cx="30" cy="150" r="1" fill="#E8E8FF" class="star8"/>
  <circle cx="160" cy="20" r="0.7" fill="#E8E8FF" class="star1"/>
  <circle cx="290" cy="100" r="0.9" fill="#E8E8FF" class="star5"/>
  <circle cx="55" cy="210" r="0.7" fill="#E8E8FF" class="star3"/>
  <circle cx="370" cy="45" r="1.1" fill="#E8E8FF" class="star2"/>

  <!-- Moon -->
  <circle cx="340" cy="50" r="22" fill="#E8E8FF" opacity="0.12" filter="url(#bigGlow)"/>
  <circle cx="340" cy="50" r="14" fill="#E8E8FF" opacity="0.2"/>

  <!-- Divine aura behind Krishna -->
  <ellipse cx="200" cy="200" rx="120" ry="140" fill="url(#auraGlow)" class="aura" filter="url(#bigGlow)"/>

  <!-- Krishna Figure - Stylized Silhouette -->
  <g transform="translate(200, 195)">
    <!-- Dhoti / lower body -->
    <path d="M-15,55 Q-25,100 -30,140 Q-20,145 0,142 Q5,110 0,55 Z" fill="url(#krishnaBody)" opacity="0.9"/>
    <path d="M15,55 Q25,100 30,140 Q20,145 0,142 Q-5,110 0,55 Z" fill="url(#krishnaBody)" opacity="0.85"/>
    <!-- Dhoti drape detail -->
    <path d="M-18,75 Q-5,80 15,72" stroke="#F5C76B" stroke-width="0.5" fill="none" opacity="0.4"/>
    <path d="M-20,90 Q-5,95 18,88" stroke="#F5C76B" stroke-width="0.4" fill="none" opacity="0.3"/>

    <!-- Torso -->
    <path d="M-18,0 Q-22,25 -15,55 L15,55 Q22,25 18,0 Z" fill="url(#krishnaBody)"/>

    <!-- Left arm (holding flute) -->
    <path d="M-18,10 Q-45,20 -70,15 Q-72,12 -68,10 Q-45,12 -18,5 Z" fill="url(#krishnaBody)"/>
    <!-- Right arm -->
    <path d="M18,10 Q45,18 65,15 Q67,12 63,10 Q45,12 18,5 Z" fill="url(#krishnaBody)"/>
    <!-- Hands -->
    <circle cx="-65" cy="12" r="5" fill="#4a7ab5"/>
    <circle cx="62" cy="12" r="5" fill="#4a7ab5"/>

    <!-- Neck -->
    <rect x="-6" y="-12" width="12" height="14" rx="3" fill="#4a7ab5"/>

    <!-- Head -->
    <ellipse cx="0" cy="-25" rx="16" ry="18" fill="#4a7ab5"/>
    <!-- Face features (subtle) -->
    <ellipse cx="-5" cy="-27" rx="1.5" ry="1" fill="#05091C" opacity="0.4"/>
    <ellipse cx="5" cy="-27" rx="1.5" ry="1" fill="#05091C" opacity="0.4"/>
    <path d="M-3,-22 Q0,-20 3,-22" stroke="#05091C" stroke-width="0.7" fill="none" opacity="0.3"/>

    <!-- Golden flute (bansuri) -->
    <g filter="url(#softGlow)">
      <rect x="-78" y="8" width="80" height="5" rx="2.5" fill="url(#goldGrad)"/>
      <!-- Flute holes -->
      <circle cx="-65" cy="10.5" r="1.2" fill="#C4943A"/>
      <circle cx="-55" cy="10.5" r="1.2" fill="#C4943A"/>
      <circle cx="-45" cy="10.5" r="1.2" fill="#C4943A"/>
      <circle cx="-35" cy="10.5" r="1.2" fill="#C4943A"/>
      <circle cx="-25" cy="10.5" r="1.2" fill="#C4943A"/>
      <circle cx="-15" cy="10.5" r="1.2" fill="#C4943A"/>
    </g>

    <!-- Peacock feather crown -->
    <g transform="translate(0, -42)">
      <!-- Feather shaft -->
      <path d="M0,0 Q5,-30 3,-55" stroke="#F5C76B" stroke-width="1.5" fill="none"/>
      <path d="M0,0 Q-3,-25 5,-50" stroke="#00D9C6" stroke-width="0.8" fill="none" opacity="0.6"/>
      <!-- Feather barbs -->
      <path d="M3,-30 Q12,-35 8,-20" fill="#00D9C6" opacity="0.5"/>
      <path d="M3,-35 Q-6,-40 -2,-25" fill="#00D9C6" opacity="0.4"/>
      <path d="M3,-40 Q14,-45 10,-32" fill="#006B63" opacity="0.5"/>
      <path d="M3,-38 Q-5,-48 -1,-33" fill="#006B63" opacity="0.4"/>
      <!-- Feather eye -->
      <ellipse cx="4" cy="-48" rx="6" ry="8" fill="url(#featherEye)" class="feather-eye" filter="url(#tinyGlow)"/>
      <ellipse cx="4" cy="-48" rx="3" ry="4" fill="#00D9C6" opacity="0.8"/>
      <ellipse cx="4" cy="-48" rx="1.5" ry="2" fill="#F5C76B"/>
    </g>

    <!-- Crown/Mukut base -->
    <path d="M-14,-36 Q-16,-42 -10,-45 Q-5,-38 0,-46 Q5,-38 10,-45 Q16,-42 14,-36" fill="#F5C76B" opacity="0.8"/>

    <!-- Necklace -->
    <path d="M-12,-2 Q0,4 12,-2" stroke="#F5C76B" stroke-width="1" fill="none" opacity="0.7"/>
    <circle cx="0" cy="3" r="2" fill="#F5C76B" opacity="0.6"/>
  </g>

  <!-- Musical notes floating -->
  <text x="155" y="185" font-size="18" fill="#F5C76B" filter="url(#softGlow)" class="note1" font-family="serif">♪</text>
  <text x="135" y="170" font-size="14" fill="#F5C76B" filter="url(#softGlow)" class="note2" font-family="serif">♫</text>
  <text x="148" y="195" font-size="12" fill="#F5C76B" filter="url(#softGlow)" class="note3" font-family="serif">♪</text>

  <!-- Golden particles rising -->
  <circle cx="170" cy="280" r="1.5" fill="#F5C76B" opacity="0.6" class="particle1" filter="url(#tinyGlow)"/>
  <circle cx="230" cy="300" r="1" fill="#F5C76B" opacity="0.5" class="particle2" filter="url(#tinyGlow)"/>
  <circle cx="185" cy="310" r="1.2" fill="#F5C76B" opacity="0.7" class="particle3" filter="url(#tinyGlow)"/>
  <circle cx="215" cy="290" r="0.8" fill="#F5C76B" opacity="0.5" class="particle4" filter="url(#tinyGlow)"/>
  <circle cx="195" cy="320" r="1.3" fill="#F5C76B" opacity="0.6" class="particle1" filter="url(#tinyGlow)"/>
  <circle cx="210" cy="330" r="1" fill="#F5C76B" opacity="0.4" class="particle2"/>

  <!-- Lotus flowers at the base -->
  <g class="lotus-base" transform="translate(140, 370)">
    <!-- Petals -->
    <ellipse cx="-10" cy="-5" rx="8" ry="4" fill="#F5A3C7" opacity="0.7" transform="rotate(-30 -10 -5)"/>
    <ellipse cx="10" cy="-5" rx="8" ry="4" fill="#F5A3C7" opacity="0.7" transform="rotate(30 10 -5)"/>
    <ellipse cx="0" cy="-8" rx="7" ry="4" fill="#F5A3C7" opacity="0.8"/>
    <ellipse cx="-6" cy="-2" rx="7" ry="3.5" fill="#F5A3C7" opacity="0.6" transform="rotate(-50 -6 -2)"/>
    <ellipse cx="6" cy="-2" rx="7" ry="3.5" fill="#F5A3C7" opacity="0.6" transform="rotate(50 6 -2)"/>
    <!-- Center -->
    <circle cx="0" cy="-5" r="3" fill="#F5C76B" opacity="0.6"/>
  </g>

  <g class="lotus-base" transform="translate(260, 375)" style="animation-delay: 1s;">
    <ellipse cx="-8" cy="-4" rx="6" ry="3" fill="#F5A3C7" opacity="0.6" transform="rotate(-30 -8 -4)"/>
    <ellipse cx="8" cy="-4" rx="6" ry="3" fill="#F5A3C7" opacity="0.6" transform="rotate(30 8 -4)"/>
    <ellipse cx="0" cy="-6" rx="5.5" ry="3" fill="#F5A3C7" opacity="0.7"/>
    <circle cx="0" cy="-4" r="2.5" fill="#F5C76B" opacity="0.5"/>
  </g>

  <g class="lotus-base" transform="translate(200, 380)" style="animation-delay: 2s;">
    <ellipse cx="-7" cy="-3" rx="5" ry="2.5" fill="#F5A3C7" opacity="0.5" transform="rotate(-25 -7 -3)"/>
    <ellipse cx="7" cy="-3" rx="5" ry="2.5" fill="#F5A3C7" opacity="0.5" transform="rotate(25 7 -3)"/>
    <ellipse cx="0" cy="-5" rx="4.5" ry="2.5" fill="#F5A3C7" opacity="0.65"/>
    <circle cx="0" cy="-3.5" r="2" fill="#F5C76B" opacity="0.5"/>
  </g>

  <!-- Ground decoration line -->
  <path d="M60,365 Q130,355 200,362 Q270,370 340,360" stroke="#173A78" stroke-width="0.8" fill="none" opacity="0.4"/>
</svg>