<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 120" role="img" aria-label="Animated peacock feather and golden devotional heading">
<defs><linearGradient id="g"><stop stop-color="#f5c66d"/><stop offset=".5" stop-color="#fff3c3"/><stop offset="1" stop-color="#dca446"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.title{font: bold 38px Georgia,serif;fill:url(#g);filter:url(#glow)}
.feather{transform-origin:120px 58px;animation:sway 4s ease-in-out infinite alternate}
.right{transform-origin:980px 58px;animation:sway 4s ease-in-out infinite alternate-reverse}
.star{animation:twinkle 2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(9deg)}}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}
</style>
<g class="feather"><path d="M50 100 Q100 60 145 10" stroke="#d6b66c" stroke-width="3" fill="none"/><ellipse cx="120" cy="35" rx="22" ry="36" fill="#178f7e" transform="rotate(35 120 35)"/><ellipse cx="120" cy="35" rx="13" ry="23" fill="#20c9bd" transform="rotate(35 120 35)"/><ellipse cx="120" cy="35" rx="9" ry="14" fill="#163e91" transform="rotate(35 120 35)"/><circle cx="120" cy="35" r="5" fill="#efb94e"/></g>
<g class="right"><path d="M1050 100 Q1000 60 955 10" stroke="#d6b66c" stroke-width="3" fill="none"/><ellipse cx="980" cy="35" rx="22" ry="36" fill="#178f7e" transform="rotate(-35 980 35)"/><ellipse cx="980" cy="35" rx="13" ry="23" fill="#20c9bd" transform="rotate(-35 980 35)"/><ellipse cx="980" cy="35" rx="9" ry="14" fill="#163e91" transform="rotate(-35 980 35)"/><circle cx="980" cy="35" r="5" fill="#efb94e"/></g>
<text x="550" y="70" text-anchor="middle" class="title">Radhe Radhe · Welcome to My Universe</text>
<g fill="#ffe6a1"><circle class="star" cx="240" cy="35" r="3"/><circle class="star" cx="840" cy="85" r="4"/><circle class="star" cx="765" cy="20" r="2"/></g>
</svg>