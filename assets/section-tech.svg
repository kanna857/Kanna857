<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="50%" stop-color="#101738"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05091C"/>
      <stop offset="20%" stop-color="#F5C76B"/>
      <stop offset="80%" stop-color="#F5C76B"/>
      <stop offset="100%" stop-color="#05091C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes gearSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes dashFlow { to { stroke-dashoffset: -40; } }
    @keyframes featherSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes fadeGlow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  </style>
  <!-- Background -->
  <rect width="1200" height="60" rx="12" fill="url(#bg)"/>
  <!-- Gear Icon Left -->
  <g transform="translate(40, 30)" style="animation: gearSpin 8s linear infinite; transform-origin: 40px 30px;">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#00D9C6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#00D9C6" opacity="0.6"/>
    <!-- gear teeth -->
    <rect x="-1.2" y="-10" width="2.4" height="4" rx="0.5" fill="#00D9C6"/>
    <rect x="-1.2" y="6" width="2.4" height="4" rx="0.5" fill="#00D9C6"/>
    <rect x="-10" y="-1.2" width="4" height="2.4" rx="0.5" fill="#00D9C6"/>
    <rect x="6" y="-1.2" width="4" height="2.4" rx="0.5" fill="#00D9C6"/>
    <rect x="5.2" y="-7.5" width="2.4" height="4" rx="0.5" fill="#00D9C6" transform="rotate(45)"/>
    <rect x="-7.6" y="3.5" width="2.4" height="4" rx="0.5" fill="#00D9C6" transform="rotate(45)"/>
    <rect x="-7.6" y="-7.5" width="2.4" height="4" rx="0.5" fill="#00D9C6" transform="rotate(-45)"/>
    <rect x="5.2" y="3.5" width="2.4" height="4" rx="0.5" fill="#00D9C6" transform="rotate(-45)"/>
  </g>
  <!-- Center Text -->
  <text x="600" y="36" text-anchor="middle" fill="#F5C76B" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" filter="url(#glow)">⚡ Tech Arsenal — Tools of Innovation</text>
  <!-- Peacock Feather Right -->
  <g transform="translate(1140, 30)" style="animation: featherSway 3s ease-in-out infinite; transform-origin: 1140px 30px;">
    <!-- stem -->
    <line x1="0" y1="14" x2="0" y2="-14" stroke="#00D9C6" stroke-width="0.8" opacity="0.6"/>
    <!-- eye shape -->
    <ellipse cx="0" cy="-8" rx="5" ry="8" fill="none" stroke="#00D9C6" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#173A78" stroke="#00D9C6" stroke-width="0.6"/>
    <ellipse cx="0" cy="-5" rx="1.8" ry="3" fill="#00D9C6" opacity="0.5"/>
    <circle cx="0" cy="-5" r="1.2" fill="#F5C76B" style="animation: fadeGlow 2s ease-in-out infinite;"/>
    <!-- barbs -->
    <line x1="-6" y1="-10" x2="-2" y2="-6" stroke="#00D9C6" stroke-width="0.4" opacity="0.4"/>
    <line x1="6" y1="-10" x2="2" y2="-6" stroke="#00D9C6" stroke-width="0.4" opacity="0.4"/>
    <line x1="-5" y1="-2" x2="-1" y2="-1" stroke="#00D9C6" stroke-width="0.3" opacity="0.3"/>
    <line x1="5" y1="-2" x2="1" y2="-1" stroke="#00D9C6" stroke-width="0.3" opacity="0.3"/>
  </g>
  <!-- Bottom golden line -->
  <line x1="60" y1="56" x2="1140" y2="56" stroke="url(#goldLine)" stroke-width="1" stroke-dasharray="8,4" style="animation: dashFlow 2s linear infinite;" opacity="0.7"/>
</svg>